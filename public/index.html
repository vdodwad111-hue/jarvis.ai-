<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>JARVIS 45</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --blue:#168cff;
  --cyan:#42baff;
  --bg:#02060d;
  --glass:rgba(255,255,255,.055);
  --border:rgba(50,165,255,.25);
}

html,body{
  width:100%;
  height:100%;
}

body{
  overflow:hidden;
  color:#fff;
  font-family:Arial,sans-serif;
  background:
    radial-gradient(circle at 50% 35%,rgba(0,100,255,.16),transparent 28%),
    radial-gradient(circle at 10% 90%,rgba(0,80,255,.08),transparent 30%),
    #02060d;
}

/* BACKGROUND */

.bg{
  position:fixed;
  inset:0;
  pointer-events:none;
  overflow:hidden;
}

.bg::before,
.bg::after{
  content:"";
  position:absolute;
  border-radius:50%;
  filter:blur(70px);
  opacity:.35;
}

.bg::before{
  width:280px;
  height:280px;
  background:#006eff;
  top:12%;
  left:-100px;
  animation:float1 8s infinite alternate ease-in-out;
}

.bg::after{
  width:240px;
  height:240px;
  background:#00aaff;
  right:-80px;
  bottom:10%;
  animation:float2 10s infinite alternate ease-in-out;
}

@keyframes float1{
  to{transform:translate(90px,50px)}
}

@keyframes float2{
  to{transform:translate(-70px,-60px)}
}

/* HEADER */

.header{
  position:relative;
  z-index:5;
  height:76px;
  padding:14px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-size:32px;
  font-weight:800;
  letter-spacing:3px;
  text-shadow:0 0 18px rgba(50,160,255,.55);
}

.status{
  display:flex;
  align-items:center;
  gap:7px;
  font-size:10px;
  letter-spacing:1.5px;
  color:#42ff88;
  font-weight:bold;
}

.status-dot{
  width:7px;
  height:7px;
  border-radius:50%;
  background:#42ff88;
  box-shadow:0 0 12px #42ff88;
}

/* MAIN */

.main{
  position:relative;
  z-index:2;
  height:calc(100vh - 76px);
  overflow-y:auto;
  padding:4px 16px 35px;
  text-align:center;
}

.brand{
  margin-top:2px;
}

.brand-title{
  font-size:13px;
  color:#8db9df;
  letter-spacing:3px;
  text-transform:uppercase;
}

.brand-sub{
  margin-top:6px;
  font-size:11px;
  color:#59758e;
  letter-spacing:1px;
}

/* CORE */

.core-area{
  height:285px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  position:relative;
}

.core{
  width:155px;
  height:155px;
  border-radius:50%;
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  background:
    radial-gradient(circle at 50% 45%,
      #bcecff 0%,
      #4cc8ff 10%,
      #078cff 28%,
      #0054c9 45%,
      #031a42 68%,
      transparent 72%);
  box-shadow:
    0 0 20px #008cff,
    0 0 55px rgba(0,130,255,.7),
    0 0 110px rgba(0,90,255,.35);
  animation:corePulse 3s infinite ease-in-out;
}

.core::before{
  content:"";
  position:absolute;
  inset:-18px;
  border-radius:50%;
  border:1px solid rgba(50,180,255,.45);
  border-left-color:transparent;
  border-right-color:transparent;
  animation:spin 5s linear infinite;
}

.core::after{
  content:"";
  position:absolute;
  inset:-35px;
  border-radius:50%;
  border:1px solid rgba(0,120,255,.18);
  border-top-color:rgba(50,190,255,.6);
  border-bottom-color:transparent;
  animation:spinReverse 8s linear infinite;
}

.core-inner{
  width:54px;
  height:54px;
  border-radius:50%;
  background:#d9f7ff;
  box-shadow:
    0 0 12px white,
    0 0 35px #48c8ff,
    0 0 70px #008cff;
  animation:innerPulse 1.8s infinite ease-in-out;
}

@keyframes corePulse{
  0%,100%{
    transform:scale(.92);
  }
  50%{
    transform:scale(1.05);
  }
}

@keyframes innerPulse{
  0%,100%{transform:scale(.85);opacity:.75}
  50%{transform:scale(1.12);opacity:1}
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

@keyframes spinReverse{
  to{transform:rotate(-360deg)}
}

.core.speaking{
  animation:coreSpeak .65s infinite alternate ease-in-out;
}

@keyframes coreSpeak{
  from{transform:scale(.88)}
  to{transform:scale(1.12)}
}

/* VOICE BUTTON */

.voice-main{
  margin-top:-4px;
  min-width:230px;
  height:52px;
  padding:0 25px;
  border-radius:16px;
  color:white;
  font-size:15px;
  font-weight:bold;
  letter-spacing:.5px;
  background:rgba(0,125,255,.12);
  border:1px solid rgba(60,175,255,.45);
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  box-shadow:
    0 0 25px rgba(0,125,255,.12),
    inset 0 1px rgba(255,255,255,.12);
  transition:.25s;
}

.voice-main:active{
  transform:scale(.96);
  background:rgba(0,140,255,.22);
}

/* WAVEFORM */

.wave{
  height:28px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:4px;
  margin:14px 0 10px;
}

.wave span{
  width:3px;
  height:7px;
  border-radius:4px;
  background:#249cff;
  box-shadow:0 0 8px #168cff;
  animation:wave 1s infinite ease-in-out;
}

.wave span:nth-child(2){animation-delay:.1s}
.wave span:nth-child(3){animation-delay:.2s}
.wave span:nth-child(4){animation-delay:.3s}
.wave span:nth-child(5){animation-delay:.4s}
.wave span:nth-child(6){animation-delay:.3s}
.wave span:nth-child(7){animation-delay:.2s}
.wave span:nth-child(8){animation-delay:.1s}

@keyframes wave{
  0%,100%{height:6px;opacity:.45}
  50%{height:25px;opacity:1}
}

/* CHAT */

.chat{
  max-width:700px;
  margin:0 auto;
  text-align:left;
  padding:4px 0 12px;
}

.message{
  max-width:88%;
  padding:12px 14px;
  margin:9px 0;
  border-radius:15px;
  line-height:1.5;
  font-size:14px;
  white-space:pre-wrap;
  word-wrap:break-word;
}

.user-message{
  margin-left:auto;
  background:rgba(0,120,255,.72);
  border:1px solid rgba(100,200,255,.3);
  border-bottom-right-radius:4px;
}

.jarvis-message{
  margin-right:auto;
  background:rgba(255,255,255,.045);
  border:1px solid rgba(60,160,255,.18);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  border-bottom-left-radius:4px;
}

/* THREE DOTS ONLY */

.thinking{
  display:flex;
  gap:5px;
  width:65px;
  padding:14px;
  align-items:center;
  justify-content:center;
}

.thinking-dot{
  width:6px;
  height:6px;
  border-radius:50%;
  background:#43b8ff;
  box-shadow:0 0 9px #168cff;
  animation:dot 1.15s infinite ease-in-out;
}

.thinking-dot:nth-child(2){animation-delay:.18s}
.thinking-dot:nth-child(3){animation-delay:.36s}

@keyframes dot{
  0%,60%,100%{
    transform:translateY(0);
    opacity:.35;
  }
  30%{
    transform:translateY(-5px);
    opacity:1;
  }
}

/* QUICK ACTIONS */

.quick-title{
  margin:12px 0 12px;
  font-size:11px;
  color:#6287a5;
  letter-spacing:2px;
  text-transform:uppercase;
}

.quick-grid{
  max-width:700px;
  margin:auto;
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}

.quick-card{
  min-height:72px;
  padding:12px;
  display:flex;
  align-items:center;
  gap:11px;
  text-align:left;
  color:white;
  background:rgba(255,255,255,.055);
  border:1px solid rgba(55,165,255,.25);
  border-radius:16px;
  backdrop-filter:blur(17px) saturate(140%);
  -webkit-backdrop-filter:blur(17px) saturate(140%);
  box-shadow:
    0 8px 28px rgba(0,0,0,.22),
    inset 0 1px rgba(255,255,255,.09);
  transition:.22s ease;
}

.quick-card:active{
  transform:scale(.96);
  background:rgba(0,130,255,.16);
  border-color:rgba(60,180,255,.65);
  box-shadow:0 0 25px rgba(0,130,255,.25);
}

.card-icon{
  width:38px;
  height:38px;
  border-radius:11px;
  display:flex;
  align-items:center;
  justify-content:center;
  flex:none;
  background:rgba(0,130,255,.11);
  border:1px solid rgba(70,175,255,.22);
  font-size:19px;
}

.card-name{
  font-size:13px;
  font-weight:bold;
}

.card-desc{
  margin-top:3px;
  color:#6e899f;
  font-size:9px;
}

/* INPUT */

.input-area{
  max-width:700px;
  margin:15px auto 0;
  display:flex;
  gap:8px;
  padding:8px;
  border-radius:17px;
  background:rgba(255,255,255,.045);
  border:1px solid rgba(60,160,255,.25);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
}

textarea{
  flex:1;
  min-width:0;
  height:43px;
  max-height:100px;
  resize:none;
  outline:none;
  border:0;
  color:white;
  background:transparent;
  font-family:Arial,sans-serif;
  font-size:14px;
  padding:12px 6px;
}

textarea::placeholder{
  color:#536c81;
}

.small-btn,
.send-btn{
  width:43px;
  height:43px;
  border-radius:13px;
  flex:none;
  color:white;
  background:rgba(255,255,255,.055);
  border:1px solid rgba(60,160,255,.24);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  font-size:17px;
}

.send-btn{
  background:rgba(0,125,255,.55);
  border-color:rgba(75,185,255,.5);
}

.small-btn:active,
.send-btn:active{
  transform:scale(.91);
}

/* MODAL */

.modal{
  position:fixed;
  inset:0;
  z-index:50;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:rgba(0,0,0,.55);
  backdrop-filter:blur(8px);
}

.modal.show{
  display:flex;
}

.modal-box{
  width:min(420px,100%);
  padding:22px;
  border-radius:20px;
  background:rgba(8,17,29,.78);
  border:1px solid rgba(60,170,255,.3);
  backdrop-filter:blur(22px);
  -webkit-backdrop-filter:blur(22px);
  box-shadow:0 0 50px rgba(0,90,255,.18);
}

.modal-box h2{
  font-size:19px;
  margin-bottom:15px;
}

.modal-box p{
  color:#a8bfd3;
  font-size:13px;
  line-height:1.6;
}

.close-modal{
  margin-top:18px;
  width:100%;
  height:44px;
  border-radius:12px;
  color:white;
  background:rgba(0,125,255,.18);
  border:1px solid rgba(70,175,255,.3);
}

/* MOBILE */

@media(max-width:520px){

  .header{
    height:70px;
    padding:12px 15px;
  }

  .logo{
    font-size:27px;
  }

  .main{
    height:calc(100vh - 70px);
    padding-left:12px;
    padding-right:12px;
  }

  .core-area{
    height:265px;
  }

  .core{
    width:135px;
    height:135px;
  }

  .quick-grid{
    gap:8px;
  }

  .quick-card{
    min-height:70px;
    padding:10px;
  }

  .card-desc{
    display:none;
  }

  .card-name{
    font-size:12px;
  }

  .voice-main{
    min-width:215px;
  }
}
</style>
</head>

<body>

<div class="bg"></div>

<header class="header">
  <div class="logo">JARVIS 45</div>

  <div class="status">
    <span class="status-dot"></span>
    SYSTEM ONLINE
  </div>
</header>

<main class="main">

  <div class="brand">
    <div class="brand-title">Personal AI Assistant</div>
    <div class="brand-sub">
      Founded &amp; Developed by SOHAM DODWAD
    </div>
  </div>

  <section class="core-area">

    <div class="core" id="core">
      <div class="core-inner"></div>
    </div>

    <button class="voice-main" onclick="voice()">
      🎙️ Voice Assistant
    </button>

  </section>

  <div class="wave" id="wave">
    <span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span>
  </div>

  <section class="chat" id="reply">
    <div class="message jarvis-message">
      Hello, I am JARVIS 45.<br>
      How can I assist you today?
    </div>
  </section>

  <div class="quick-title">Quick Actions</div>

  <section class="quick-grid">

    <button class="quick-card" onclick="voice()">
      <div class="card-icon">🎙️</div>
      <div>
        <div class="card-name">Voice Assistant</div>
        <div class="card-desc">Talk with JARVIS</div>
      </div>
    </button>

    <button class="quick-card" onclick="newChat()">
      <div class="card-icon">💬</div>
      <div>
        <div class="card-name">New Chat</div>
        <div class="card-desc">Start fresh</div>
      </div>
    </button>

    <button class="quick-card" onclick="webSearch()">
      <div class="card-icon">🌐</div>
      <div>
        <div class="card-name">Web Search</div>
        <div class="card-desc">Search the web</div>
      </div>
    </button>

    <button class="quick-card" onclick="createFile()">
      <div class="card-icon">📁</div>
      <div>
        <div class="card-name">My Files</div>
        <div class="card-desc">Create a file</div>
      </div>
    </button>

    <button class="quick-card" onclick="showHistory()">
      <div class="card-icon">🕘</div>
      <div>
        <div class="card-name">Chat History</div>
        <div class="card-desc">Current session</div>
      </div>
    </button>

    <button class="quick-card" onclick="showMemory()">
      <div class="card-icon">🧠</div>
      <div>
        <div class="card-name">Memory</div>
        <div class="card-desc">Session memory</div>
      </div>
    </button>

    <button class="quick-card" onclick="feedback()">
      <div class="card-icon">⭐</div>
      <div>
        <div class="card-name">Feedback</div>
        <div class="card-desc">Share feedback</div>
      </div>
    </button>

    <button class="quick-card" onclick="showSettings()">
      <div class="card-icon">⚙️</div>
      <div>
        <div class="card-name">Settings</div>
        <div class="card-desc">JARVIS settings</div>
      </div>
    </button>

    <button class="quick-card" onclick="showAbout()">
      <div class="card-icon">ℹ️</div>
      <div>
        <div class="card-name">About JARVIS</div>
        <div class="card-desc">About this AI</div>
      </div>
    </button>

  </section>

  <div class="input-area">

    <button class="small-btn" onclick="voice()">🎙️</button>

    <textarea
      id="question"
      placeholder="Ask JARVIS..."
      rows="1"
    ></textarea>

    <button class="small-btn" onclick="stopSpeaking()">⏹</button>

    <button class="send-btn" onclick="ask()">➤</button>

  </div>

</main>

<div class="modal" id="modal">
  <div class="modal-box">
    <h2 id="modalTitle">JARVIS</h2>
    <p id="modalText"></p>
    <button class="close-modal" onclick="closeModal()">Close</button>
  </div>
</div>

<script>

/* SESSION */

let sessionId=localStorage.getItem("jarvisSessionId");

if(!sessionId){
  sessionId="jarvis-"+Date.now()+"-"+Math.random().toString(36).slice(2);
  localStorage.setItem("jarvisSessionId",sessionId);
}

/* ELEMENTS */

const input=document.getElementById("question");
const reply=document.getElementById("reply");
const core=document.getElementById("core");

/* ASK */

async function ask(){

  stopSpeaking();

  const q=input.value.trim();

  if(!q)return;

  addMessage(q,"user");

  input.value="";

  const thinking=addThinking();

  try{

    const res=await fetch("/api/chat",{
      method:"POST",
      headers:{
        "Content-Type":"application/json"
      },
      body:JSON.stringify({
        message:q,
        sessionId:sessionId
      })
    });

    const data=await res.json();

    thinking.remove();

    if(!res.ok){
      throw new Error(data.error||"Request failed");
    }

    const text=data.reply||"No response received.";

    addMessage(text,"jarvis");

    speakText(text);

  }catch(error){

    console.error(error);

    if(thinking)thinking.remove();

    addMessage(
      "Sorry, JARVIS couldn't respond.",
      "jarvis"
    );
  }
}

/* MESSAGE */

function addMessage(text,type){

  const message=document.createElement("div");

  message.className=
    "message "+
    (type==="user" ? "user-message":"jarvis-message");

  message.textContent=text;

  reply.appendChild(message);

  scrollChat();

  return message;
}

/* THREE DOTS */

function addThinking(){

  const box=document.createElement("div");

  box.className=
    "message jarvis-message thinking";

  for(let i=0;i<3;i++){

    const dot=document.createElement("span");

    dot.className="thinking-dot";

    box.appendChild(dot);
  }

  reply.appendChild(box);

  scrollChat();

  return box;
}

/* SCROLL */

function scrollChat(){

  reply.scrollTop=reply.scrollHeight;
}

/* SPEECH */

function speakText(text){

  if(!("speechSynthesis" in window))return;

  window.speechSynthesis.cancel();

  const speech=new SpeechSynthesisUtterance(text);

  speech.lang="en-IN";
  speech.rate=1;
  speech.pitch=1;

  core.classList.add("speaking");

  speech.onend=()=>{
    core.classList.remove("speaking");
  };

  speech.onerror=()=>{
    core.classList.remove("speaking");
  };

  window.speechSynthesis.speak(speech);
}

/* STOP */

function stopSpeaking(){

  if("speechSynthesis" in window){
    window.speechSynthesis.cancel();
  }

  core.classList.remove("speaking");
}

/* ENTER */

input.addEventListener("keydown",function(e){

  if(e.key==="Enter"&&!e.shiftKey){

    e.preventDefault();

    ask();
  }
});

/* VOICE */

function voice(){

  const Recognition=
    window.SpeechRecognition||
    window.webkitSpeechRecognition;

  if(!Recognition){

    showModal(
      "Voice Assistant",
      "Voice recognition is not available. Please use Google Chrome."
    );

    return;
  }

  const recognition=new Recognition();

  recognition.lang="en-IN";
  recognition.continuous=false;
  recognition.interimResults=false;

  recognition.onstart=()=>{
    core.classList.add("speaking");
  };

  recognition.onresult=(event)=>{

    const text=
      event.results[0][0].transcript;

    input.value=text;

    core.classList.remove("speaking");

    ask();
  };

  recognition.onerror=(event)=>{

    core.classList.remove("speaking");

    showModal(
      "Voice Assistant",
      "Voice error: "+event.error
    );
  };

  recognition.onend=()=>{
    core.classList.remove("speaking");
  };

  try{
    recognition.start();
  }catch(e){
    console.log(e);
  }
}

/* NEW CHAT */

async function newChat(){

  stopSpeaking();

  try{

    await fetch("/api/new-chat",{
      method:"POST",
      headers:{
        "Content-Type":"application/json"
      },
      body:JSON.stringify({
        sessionId:sessionId
      })
    });

  }catch(e){
    console.log(e);
  }

  const newSession=
    "jarvis-"+
    Date.now()+
    "-"+
    Math.random().toString(36).slice(2);

  localStorage.setItem(
    "jarvisSessionId",
    newSession
  );

  location.reload();
}

/* CREATE FILE */

async function createFile(){

  const filename=prompt(
    "Enter file name:",
    "jarvis.txt"
  );

  if(!filename)return;

  const content=prompt(
    "Enter file content:"
  );

  if(content===null)return;

  try{

    const res=await fetch(
      "/api/create-file",
      {
        method:"POST",
        headers:{
          "Content-Type":"application/json"
        },
        body:JSON.stringify({
          filename:filename,
          content:content
        })
      }
    );

    const data=await res.json();

    if(!res.ok){
      throw new Error(
        data.error||"File creation failed"
      );
    }

    const blob=new Blob(
      [data.content],
      {
        type:data.mimeType||"text/plain"
      }
    );

    const url=URL.createObjectURL(blob);

    const link=document.createElement("a");

    link.href=url;
    link.download=data.filename;

    document.body.appendChild(link);
    link.click();
    link.remove();

    URL.revokeObjectURL(url);

    addMessage(
      "📁 File created successfully: "+
      data.filename,
      "jarvis"
    );

  }catch(error){

    addMessage(
      "❌ Could not create the file.",
      "jarvis"
    );
  }
}

/* MEMORY */

async function showMemory(){

  try{

    const res=await fetch(
      "/api/memory",
      {
        method:"POST",
        headers:{
          "Content-Type":"application/json"
        },
        body:JSON.stringify({
          sessionId:sessionId
        })
      }
    );

    const data=await res.json();

    addMessage(
      "🧠 Memory is ON.\n\n"+
      "JARVIS currently remembers "+
      (data.messages||0)+
      " messages in this chat session.",
      "jarvis"
    );

  }catch(e){

    addMessage(
      "Unable to check memory.",
      "jarvis"
    );
  }
}

/* WEB SEARCH */

async function webSearch(){

  const query=prompt(
    "What do you want to search?"
  );

  if(!query)return;

  const thinking=addThinking();

  try{

    const res=await fetch(
      "/api/search",
      {
        method:"POST",
        headers:{
          "Content-Type":"application/json"
        },
        body:JSON.stringify({
          query:query
        })
      }
    );

    const data=await res.json();

    thinking.remove();

    if(!res.ok){
      throw new Error(
        data.error||"Search failed"
      );
    }

    if(!data.results||!data.results.length){

      addMessage(
        "🔍 No results found.",
        "jarvis"
      );

      return;
    }

    addMessage(
      "🔍 Web results for: "+query,
      "jarvis"
    );

    data.results.forEach(result=>{

      const box=document.createElement("div");

      box.className=
        "message jarvis-message";

      const title=document.createElement("b");

      title.textContent=result.title||"Result";

      const desc=document.createElement("div");

      desc.style.marginTop="6px";
      desc.style.color="#9db4c9";
      desc.style.fontSize="12px";
      desc.textContent=
        result.description||
        "No description available.";

      const link=document.createElement("a");

      link.href=result.url;
      link.target="_blank";
      link.rel="noopener noreferrer";

      link.textContent="Open source ↗";

      link.style.display="inline-block";
      link.style.marginTop="8px";
      link.style.color="#42baff";

      box.appendChild(title);
      box.appendChild(desc);
      box.appendChild(link);

      reply.appendChild(box);
    });

    scrollChat();

  }catch(error){

    if(thinking)thinking.remove();

    addMessage(
      "❌ Web search failed.",
      "jarvis"
    );
  }
}
