<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS 45</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  background:#030711;
  color:#fff;
  font-family:Arial,sans-serif;
  overflow:hidden;
}

body:before{
  content:"";
  position:fixed;
  inset:-50%;
  background:
    radial-gradient(circle at 50% 45%,rgba(0,140,255,.18),transparent 25%),
    radial-gradient(circle at 20% 80%,rgba(0,80,255,.10),transparent 25%),
    radial-gradient(circle at 80% 20%,rgba(0,190,255,.08),transparent 25%);
  animation:bg 10s linear infinite;
  pointer-events:none;
}

@keyframes bg{
  50%{
    transform:rotate(8deg) scale(1.08);
  }
}

.top{
  height:70px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 20px;
  position:relative;
  z-index:5;
}

.logo{
  font-size:21px;
  font-weight:800;
  letter-spacing:2px;
  color:#67c7ff;
  text-shadow:0 0 15px #168cff;
}

.menu{
  width:44px;
  height:44px;
  border:1px solid #263b55;
  border-radius:14px;
  background:rgba(15,27,42,.7);
  color:#fff;
  font-size:22px;
  cursor:pointer;
}

.main{
  height:calc(100vh - 70px);
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:20px;
  position:relative;
  z-index:2;
  overflow:hidden;
}

.core{
  width:155px;
  height:155px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  font-size:20px;
  font-weight:bold;
  letter-spacing:2px;

  background:
    radial-gradient(circle at 35% 30%,
    #fff 0%,
    #a7e8ff 8%,
    #20aaff 25%,
    #0868d9 48%,
    #031a3d 72%,
    #020817 100%);

  box-shadow:
    0 0 20px #168cff,
    0 0 60px rgba(0,130,255,.8),
    0 0 120px rgba(0,100,255,.35);

  position:relative;
  animation:core 3s ease-in-out infinite;
}

.core:before,
.core:after{
  content:"";
  position:absolute;
  border:1px solid rgba(70,190,255,.8);
  border-radius:50%;
}

.core:before{
  width:205px;
  height:75px;
  transform:rotate(25deg);
  box-shadow:0 0 15px rgba(0,160,255,.5);
}

.core:after{
  width:225px;
  height:85px;
  transform:rotate(-25deg);
  box-shadow:0 0 15px rgba(0,160,255,.5);
}

@keyframes core{
  50%{
    transform:scale(1.06);

    box-shadow:
      0 0 30px #168cff,
      0 0 80px rgba(0,130,255,.9),
      0 0 140px rgba(0,100,255,.4);
  }
}

.status{
  margin-top:38px;
  text-align:center;
}

.status h1{
  margin:0;
  font-size:32px;
}

.status p{
  margin-top:10px;
  color:#72839a;
}

.online{
  display:inline-flex;
  align-items:center;
  gap:7px;
  margin-top:10px;
  color:#6fc9ff;
  font-size:13px;
}

.dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:#32b8ff;
  box-shadow:0 0 12px #32b8ff;
  animation:blink 1.5s infinite;
}

@keyframes blink{
  50%{
    opacity:.3;
  }
}

.chat{
  width:min(700px,100%);
  margin-top:28px;
  padding:14px;
  border:1px solid #24364d;
  border-radius:25px;
  background:rgba(12,20,32,.82);
  box-shadow:0 15px 50px rgba(0,0,0,.4);
  backdrop-filter:blur(20px);
  transition:.3s;
}

.chat:focus-within{
  border-color:#168cff;
  box-shadow:0 0 30px rgba(0,140,255,.18);
}

textarea{
  width:100%;
  height:58px;
  border:0;
  outline:0;
  resize:none;
  background:transparent;
  color:#fff;
  font-size:16px;
  padding:8px;
}

textarea::placeholder{
  color:#65758b;
}

.controls{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.tools{
  display:flex;
  gap:9px;
}

.btn{
  width:42px;
  height:42px;
  border:1px solid #263b55;
  border-radius:50%;
  background:#101b2a;
  color:#fff;
  font-size:18px;
  cursor:pointer;
  transition:.2s;
}

.btn:hover{
  transform:translateY(-2px);
  border-color:#168cff;
  box-shadow:0 0 15px rgba(0,140,255,.4);
}

.send{
  background:#168cff;
  border:0;
  box-shadow:0 0 18px rgba(0,140,255,.45);
}

/* CHAT HISTORY */

.reply{
  width:min(700px,100%);
  flex:1;
  margin-top:18px;
  min-height:0;
  overflow-y:auto;
  display:flex;
  flex-direction:column;
  gap:10px;
  padding:5px;
  scroll-behavior:smooth;
}

.reply::-webkit-scrollbar{
  width:5px;
}

.reply::-webkit-scrollbar-thumb{
  background:#263b55;
  border-radius:10px;
}

.message{
  max-width:82%;
  padding:12px 15px;
  border-radius:18px;
  line-height:1.45;
  white-space:pre-wrap;
  word-wrap:break-word;
  font-size:15px;
}

.user-message{
  align-self:flex-end;
  background:#168cff;
  color:#fff;
  border-bottom-right-radius:5px;
  box-shadow:0 5px 20px rgba(0,140,255,.18);
}

.jarvis-message{
  align-self:flex-start;
  background:#101b2a;
  color:#cfe8ff;
  border:1px solid #263b55;
  border-bottom-left-radius:5px;
}

.typing{
  opacity:.7;
}

/* CREATE MENU */

.create{
  display:none;
  position:absolute;
  bottom:85px;
  left:15px;
  width:190px;
  padding:8px;
  border:1px solid #263b55;
  border-radius:18px;
  background:#0d1725;
  box-shadow:0 15px 40px rgba(0,0,0,.5);
  z-index:10;
}

.create div{
  padding:13px;
  border-radius:12px;
  color:#dceeff;
}

.create div:hover{
  background:#16263a;
}

/* SIDE MENU */

.side{
  position:fixed;
  top:0;
  left:-310px;
  width:300px;
  height:100%;
  padding:25px;
  background:rgba(5,12,22,.97);
  border-right:1px solid #263b55;
  z-index:20;
  transition:.35s ease;
  box-shadow:15px 0 50px rgba(0,0,0,.4);
}

.side.open{
  left:0;
}

.side h2{
  color:#65c5ff;
  letter-spacing:2px;
}

.item{
  padding:15px;
  margin:10px 0;
  border:1px solid #1d2d42;
  border-radius:15px;
  background:#0d1724;
  cursor:pointer;
}

.item:hover{
  border-color:#168cff;
  background:#122338;
}

/* MOBILE */

@media(max-width:600px){

  .core{
    width:125px;
    height:125px;
    font-size:17px;
  }

  .core:before{
    width:170px;
    height:65px;
  }

  .core:after{
    width:185px;
    height:70px;
  }

  .status h1{
    font-size:27px;
  }

  .chat{
    border-radius:21px;
  }

  .reply{
    max-height:230px;
  }

  .message{
    max-width:88%;
  }
}
</style>
</head>

<body>

<div class="top">

  <div class="logo">
    JARVIS 45
  </div>

  <button class="menu" onclick="toggleSide()">
    ☰
  </button>

</div>


<div class="main">

  <div class="core">
    JARVIS<br>45
  </div>


  <div class="status">

    <h1>
      Hello, I Am JARVIS
    </h1>

    <p>
      Founded &amp; Developed by SOHAM DODWAD
    </p>

    <div class="online">
      <span class="dot"></span>
      SYSTEM ONLINE
    </div>

  </div>


  <!-- CHAT INPUT -->

  <div class="chat">

    <textarea
      id="question"
      placeholder="Ask JARVIS anything..."
    ></textarea>


    <div class="controls">

      <div class="tools">

        <button
          class="btn"
          onclick="toggleCreate()">
          ＋
        </button>

        <button
          class="btn"
          onclick="voice()">
          🎙
        </button>

      </div>


      <button
        class="btn send"
        onclick="ask()">
        ↑
      </button>

    </div>

  </div>


  <!-- CHAT HISTORY -->

  <div
    class="reply"
    id="reply">
  </div>

</div>


<!-- CREATE MENU -->

<div
  class="create"
  id="create">

  <div onclick="createFile()">
    📄 Create File
  </div>

  <div>
    📎 Upload File
  </div>

  <div>
    🖼️ Add Image
  </div>

</div>


<!-- SIDE MENU -->

<div
  class="side"
  id="side">

  <h2>
    JARVIS 45
  </h2>

  <div class="item">
    ＋ New Chat
  </div>

  <div class="item">
    🕘 Chat History
  </div>

  <div class="item">
    📁 My Files
  </div>

  <div class="item">
    ⚙️ Settings
  </div>

  <div class="item">
    💬 Feedback
  </div>

  <div
    class="item"
    onclick="toggleSide()">
    ✕ Close
  </div>

</div>


<script>

/* ASK JARVIS */

async function ask(){

  const input =
    document.getElementById("question");

  const q =
    input.value.trim();

  const reply =
    document.getElementById("reply");


  if(!q){

    addMessage(
      "I'm listening... Ask me something.",
      "jarvis"
    );

    return;
  }


  /* USER MESSAGE */

  addMessage(
    q,
    "user"
  );


  /* CLEAR INPUT */

  input.value = "";


  /* TYPING MESSAGE */

  const typing =
    addMessage(
      "JARVIS is thinking...",
      "jarvis"
    );

  typing.classList.add("typing");


  try{

    const res =
      await fetch(
        "/api/chat",
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({
            message:q
          })
        }
      );


    const data =
      await res.json();


    if(!res.ok){

      throw new Error(
        data.error ||
        "Request failed"
      );

    }


    /* REPLACE TYPING MESSAGE */

    typing.classList.remove("typing");

    typing.textContent =
      data.reply || 
      "Gemini returned an empty response.";


    scrollChat();


  }catch(error){

    console.error(error);

    typing.classList.remove("typing");

    typing.textContent =
      "Sorry, JARVIS couldn't respond.";

  }

}


/* ADD MESSAGE */

function addMessage(text,type){

  const reply =
    document.getElementById("reply");


  const message =
    document.createElement("div");


  message.classList.add(
    "message"
  );


  if(type === "user"){

    message.classList.add(
      "user-message"
    );

  }else{

    message.classList.add(
      "jarvis-message"
    );

  }


  message.textContent =
    text;


  reply.appendChild(
    message
  );


  scrollChat();


  return message;
}


/* AUTO SCROLL */

function scrollChat(){

  const reply =
    document.getElementById("reply");

  reply.scrollTop =
    reply.scrollHeight;

}


/* ENTER TO SEND */

document
  .getElementById("question")
  .addEventListener(
    "keydown",
    function(event){

      if(
        event.key === "Enter" &&
        !event.shiftKey
      ){

        event.preventDefault();

        ask();

      }

    }
  );


/* SIDE MENU */

function toggleSide(){

  document
    .getElementById("side")
    .classList
    .toggle("open");

}


/* CREATE MENU */

function toggleCreate(){

  const menu =
    document.getElementById("create");


  menu.style.display =
    menu.style.display === "block"
    ? "none"
    : "block";

}


/* CREATE FILE */

function createFile(){

  addMessage(
    "📄 Create File selected.",
    "jarvis"
  );


  document
    .getElementById("create")
    .style.display =
      "none";

}


/* VOICE */

function voice(){

  if(
    !("webkitSpeechRecognition"
      in window)
  ){

    addMessage(
      "Voice recognition is not supported.",
      "jarvis"
    );

    return;
  }


  const recognition =
    new webkitSpeechRecognition();


  recognition.lang =
    "en-IN";


  recognition.onstart =
    function(){

      addMessage(
        "🎙️ Listening...",
        "jarvis"
      );

    };


  recognition.onresult =
    function(event){

      document
        .getElementById("question")
        .value =
          event
          .results[0][0]
          .transcript;

    };


  recognition.onerror =
    function(){

      addMessage(
        "Voice recognition failed.",
        "jarvis"
      );

    };


  recognition.start();

}

</script>

</body>
  </html>
