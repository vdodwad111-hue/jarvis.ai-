<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>JARVIS 45</title>

<style>

@import url(
  'https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&display=swap'
);

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  background:#05070b;
  color:white;
  font-family:Arial,sans-serif;
  height:100vh;
  overflow:hidden;
}

.header{
  height:86px;
  padding:20px 22px 10px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid rgba(0,140,255,.25);
  background:linear-gradient(
    180deg,
    #08111d,
    #05070b
  );
}

.logo{
  font-family:'Oswald',sans-serif;
  font-size:38px;
  font-weight:700;
  letter-spacing:2px;
  transform:scaleX(.82);
  transform-origin:left;
  color:#f2f6ff;
  text-shadow:
    0 0 8px rgba(255,255,255,.2),
    0 0 22px rgba(0,130,255,.25);
}

.online{
  display:flex;
  align-items:center;
  gap:7px;
  font-size:11px;
  letter-spacing:1.5px;
  color:#21ff72;
  font-weight:bold;
}

.online-dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:#21ff72;
  box-shadow:0 0 10px #21ff72;
}

.chat{
  position:absolute;
  top:100px;
  left:0;
  right:0;
  bottom:105px;
  overflow-y:auto;
  padding:12px 16px 25px;
}

.message{
  max-width:88%;
  margin:10px 0;
  padding:12px 15px;
  border-radius:13px;
  line-height:1.45;
  font-size:15px;
  word-wrap:break-word;
}

.user-message{
  margin-left:auto;
  background:#087cff;
  border-bottom-right-radius:3px;
  box-shadow:0 0 12px rgba(0,124,255,.18);
}

.jarvis-message{
  margin-right:auto;
  background:#111820;
  border:1px solid rgba(0,150,255,.2);
  border-bottom-left-radius:3px;
}

.message-image{
  display:block;
  width:100%;
  max-width:500px;
  margin-top:10px;
  border-radius:14px;
}

.thinking{
  display:flex;
  gap:5px;
  width:max-content;
  padding:13px 16px;
}

.thinking-dot{
  width:7px;
  height:7px;
  background:#36a9ff;
  border-radius:50%;
  animation:thinking 1.2s infinite;
  box-shadow:0 0 8px #168cff;
}

.thinking-dot:nth-child(2){
  animation-delay:.2s;
}

.thinking-dot:nth-child(3){
  animation-delay:.4s;
}

@keyframes thinking{

  0%,60%,100%{
    transform:translateY(0);
    opacity:.35;
  }

  30%{
    transform:translateY(-5px);
    opacity:1;
  }

}

.bottom{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  padding:12px;
  background:
    linear-gradient(
      180deg,
      transparent,
      #05070b 25%
    );
}

.input-box{
  display:flex;
  align-items:flex-end;
  gap:8px;
  padding:8px;
  background:#0c1118;
  border:1px solid rgba(0,140,255,.35);
  border-radius:18px;
  box-shadow:0 0 18px rgba(0,100,255,.08);
}

textarea{
  flex:1;
  resize:none;
  height:44px;
  max-height:100px;
  border:0;
  outline:0;
  background:transparent;
  color:white;
  font-size:15px;
  padding:12px 8px;
  font-family:Arial,sans-serif;
}

textarea::placeholder{
  color:#647080;
}

button{
  border:0;
  cursor:pointer;
}

.icon-btn{
  width:42px;
  height:42px;
  border-radius:50%;
  background:#151d27;
  color:#9bb8d6;
  font-size:19px;
}

.send-btn{
  width:42px;
  height:42px;
  border-radius:50%;
  background:#087cff;
  color:white;
  font-size:18px;
  box-shadow:0 0 14px rgba(0,124,255,.4);
}

.icon-btn:active,
.send-btn:active{
  transform:scale(.92);
}

/* SIDE MENU */

.side{
  position:fixed;
  top:0;
  left:-280px;
  width:270px;
  height:100vh;
  background:#080d14;
  border-right:1px solid rgba(0,130,255,.3);
  z-index:20;
  padding:25px;
  transition:.3s;
}

.side.open{
  left:0;
}

.side h2{
  font-family:'Oswald',sans-serif;
  letter-spacing:2px;
  margin-bottom:25px;
}

.menu-btn{
  width:100%;
  padding:13px;
  margin:7px 0;
  border-radius:10px;
  background:#101923;
  color:white;
  text-align:left;
}

/* CREATE MENU */

.create{
  display:none;
  position:absolute;
  bottom:70px;
  left:12px;
  background:#0c121a;
  border:1px solid rgba(0,140,255,.3);
  border-radius:12px;
  padding:8px;
  z-index:10;
  max-height:70vh;
  overflow-y:auto;
}

.create button{
  display:block;
  width:190px;
  padding:11px;
  background:transparent;
  color:white;
  text-align:left;
  border-radius:8px;
  font-size:14px;
}

.create button:hover{
  background:#132131;
}

@media(max-width:500px){

  .logo{
    font-size:34px;
  }

  .chat{
    top:94px;
    bottom:105px;
    padding-left:12px;
    padding-right:12px;
  }

  .message{
    max-width:92%;
  }

  .create button{
    width:185px;
  }

}

</style>

</head>

<body>

<!-- =========================
     SIDE MENU
========================= -->

<div class="side" id="side">

  <h2>JARVIS 45</h2>

  <button
    class="menu-btn"
    onclick="toggleSide()"
  >
    ✕ Close
  </button>

  <button
    class="menu-btn"
    onclick="createFile()"
  >
    📄 Create File
  </button>

  <button
    class="menu-btn"
    onclick="newChat()"
  >
    🆕 New Chat
  </button>

</div>


<!-- =========================
     HEADER
========================= -->

<header class="header">

  <div class="logo">
    JARVIS 45
  </div>

  <div class="online">

    <span class="online-dot"></span>

    SYSTEM ONLINE

  </div>

</header>


<!-- =========================
     CHAT
========================= -->

<main
  class="chat"
  id="reply"
>

  <div class="message jarvis-message">

    Hello, I am JARVIS, created and developed by SOHAM DODWAD.

  </div>

</main>


<!-- =========================
     BOTTOM
========================= -->

<div class="bottom">

  <!-- PLUS MENU -->

  <div
    class="create"
    id="create"
  >

    <button onclick="createFile()">
      📄 Create File
    </button>

    <button onclick="newChat()">
      🆕 New Chat
    </button>

    <button onclick="showMemory()">
      🧠 Memory
    </button>

    <button onclick="createImage()">
      🖼️ Create Image
    </button>

    <button onclick="webSearch()">
      🔍 Web Search
    </button>

    <button onclick="voiceMode()">
      🎙️ Voice Mode
    </button>

    <button onclick="showSettings()">
      ⚙️ Settings
    </button>

    <button onclick="showAbout()">
      ℹ️ About JARVIS
    </button>

  </div>


  <!-- INPUT -->

  <div class="input-box">

    <button
      class="icon-btn"
      onclick="toggleCreate()"
    >
      ＋
    </button>

    <textarea
      id="question"
      placeholder="Ask JARVIS..."
      rows="1"
    ></textarea>

    <button
      class="icon-btn"
      onclick="stopSpeaking()"
    >
      ⏹️
    </button>

    <button
      class="icon-btn"
      onclick="voice()"
    >
      🎙️
    </button>

    <button
      class="send-btn"
      onclick="ask()"
    >
      ➤
    </button>

  </div>

</div>


<script>

/* =========================
   SESSION MEMORY ID
========================= */

const sessionId =
  localStorage.getItem(
    "jarvisSessionId"
  ) ||
  (
    "jarvis-" +
    Date.now() +
    "-" +
    Math.random()
      .toString(36)
      .slice(2)
  );

localStorage.setItem(
  "jarvisSessionId",
  sessionId
);


/* =========================
   ASK JARVIS
========================= */

async function ask(){

  stopSpeaking();

  const input =
    document.getElementById(
      "question"
    );

  const q =
    input.value.trim();

  if(!q){

    addMessage(
      "I'm listening... Ask me something.",
      "jarvis"
    );

    return;
  }

  addMessage(
    q,
    "user"
  );

  input.value = "";

  const thinking =
    addThinking();

  try{

    const res =
      await fetch(
        "/api/chat",
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({

            message:q,

            sessionId:
              sessionId

          })

        }
      );

    const data =
      await res.json();

    if(!res.ok){

      throw new Error(
        data.error ||
        "Request failed"
      );

    }

    thinking.remove();

    const replyText =
      data.reply ||
      "No response received.";

    addMessage(
      replyText,
      "jarvis"
    );

    speakText(
      replyText
    );

  }catch(error){

    console.error(
      "JARVIS ERROR:",
      error
    );

    thinking.remove();

    addMessage(
      "Sorry, JARVIS couldn't respond.",
      "jarvis"
    );

  }

}


/* =========================
   SPEAK
========================= */

function speakText(text){

  if(
    "speechSynthesis" in window
  ){

    window.speechSynthesis.cancel();

    const speech =
      new SpeechSynthesisUtterance(
        text
      );

    speech.lang =
      "en-IN";

    speech.rate =
      1;

    speech.pitch =
      1;

    window.speechSynthesis.speak(
      speech
    );

  }

}


/* =========================
   ADD MESSAGE
========================= */

function addMessage(
  text,
  type
){

  const reply =
    document.getElementById(
      "reply"
    );

  const message =
    document.createElement(
      "div"
    );

  message.classList.add(
    "message"
  );

  if(
    type === "user"
  ){

    message.classList.add(
      "user-message"
    );

  }else{

    message.classList.add(
      "jarvis-message"
    );

  }

  message.textContent =
    text;

  reply.appendChild(
    message
  );

  scrollChat();

  return message;

}


/* =========================
   THINKING DOTS
========================= */

function addThinking(){

  const reply =
    document.getElementById(
      "reply"
    );

  const message =
    document.createElement(
      "div"
    );

  message.classList.add(
    "message",
    "jarvis-message",
    "thinking"
  );

  for(
    let i = 0;
    i < 3;
    i++
  ){

    const dot =
      document.createElement(
        "span"
      );

    dot.classList.add(
      "thinking-dot"
    );

    message.appendChild(
      dot
    );

  }

  reply.appendChild(
    message
  );

  scrollChat();

  return message;

}


/* =========================
   SCROLL
========================= */

function scrollChat(){

  const reply =
    document.getElementById(
      "reply"
    );

  reply.scrollTop =
    reply.scrollHeight;

}


/* =========================
   ENTER TO SEND
========================= */

document
  .getElementById(
    "question"
  )
  .addEventListener(
    "keydown",
    function(event){

      if(
        event.key === "Enter" &&
        !event.shiftKey
      ){

        event.preventDefault();

        ask();

      }

    }
  );


/* =========================
   SIDE MENU
========================= */

function toggleSide(){

  document
    .getElementById(
      "side"
    )
    .classList
    .toggle(
      "open"
    );

}


/* =========================
   CREATE MENU
========================= */

function toggleCreate(){

  const menu =
    document.getElementById(
      "create"
    );

  menu.style.display =
    menu.style.display === "block"
      ? "none"
      : "block";

}


/* =========================
   CREATE FILE
========================= */

async function createFile(){

  const filename =
    prompt(
      "Enter file name:",
      "jarvis.txt"
    );

  if(!filename){
    return;
  }

  const content =
    prompt(
      "Enter file content:"
    );

  if(
    content === null
  ){
    return;
  }

  try{

    const res =
      await fetch(
        "/api/create-file",
        {

          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({

            filename:
              filename,

            content:
              content

          })

        }
      );

    const data =
      await res.json();

    if(!res.ok){

      throw new Error(
        data.error ||
        "File creation failed"
      );

    }

    const blob =
      new Blob(
        [
          data.content
        ],
        {
          type:
            data.mimeType ||
            "text/plain"
        }
      );

    const url =
      URL.createObjectURL(
        blob
      );

    const link =
      document.createElement(
        "a"
      );

    link.href =
      url;

    link.download =
      data.filename;

    document
      .body
      .appendChild(
        link
      );

    link.click();

    link.remove();

    URL.revokeObjectURL(
      url
    );

    addMessage(
      "📄 File created successfully: " +
      data.filename,
      "jarvis"
    );

    closeCreateMenu();

  }catch(error){

    console.error(
      error
    );

    addMessage(
      "❌ Could not create the file.",
      "jarvis"
    );

  }

}


/* =========================
   NEW CHAT
========================= */

async function newChat(){

  stopSpeaking();

  try{

    await fetch(
      "/api/new-chat",
      {

        method:"POST",

        headers:{
          "Content-Type":
            "application/json"
        },

        body:JSON.stringify({

          sessionId:
            sessionId

        })

      }
    );

  }catch(error){

    console.log(
      error
    );

  }

  const newSession =
    "jarvis-" +
    Date.now() +
    "-" +
    Math.random()
      .toString(36)
      .slice(2);

  localStorage.setItem(
    "jarvisSessionId",
    newSession
  );

  location.reload();

}


/* =========================
   MEMORY
========================= */

async function showMemory(){

  try{

    const res =
      await fetch(
        "/api/memory",
        {

          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({

            sessionId:
              sessionId

          })

        }
      );

    const data =
      await res.json();

    addMessage(

      "🧠 Memory is ON. JARVIS currently remembers " +
      data.messages +
      " messages in this chat session.",

      "jarvis"

    );

    closeCreateMenu();

  }catch(error){

    addMessage(
      "Unable to check memory.",
      "jarvis"
    );

  }

}


/* =========================
   CREATE IMAGE
========================= */

async function createImage(){

  const promptText =
    prompt(
      "What image should JARVIS create?"
    );

  if(!promptText){
    return;
  }

  closeCreateMenu();

  const thinking =
    addThinking();

  try{

    const res =
      await fetch(
        "/api/create-image",
        {

          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({

            prompt:
              promptText

          })

        }
      );

    const data =
      await res.json();

    thinking.remove();

    if(!res.ok){

      throw new Error(
        data.error ||
        "Image generation failed."
      );

    }

    if(
      data.image
    ){

      const message =
        document.createElement(
          "div"
        );

      message.className =
        "message jarvis-message";

      message.textContent =
        "🖼️ Image created:";

      const image =
        document.createElement(
          "img"
        );

      image.className =
        "message-image";

      image.src =
        "data:" +
        (
          data.mediaType ||
          "image/png"
        ) +
        ";base64," +
        data.image;

      message.appendChild(
        image
      );

      document
        .getElementById(
          "reply"
        )
        .appendChild(
          message
        );

      scrollChat();

    }else{

      addMessage(
        "❌ No image was returned.",
        "jarvis"
      );

    }

  }catch(error){

    console.error(
      "IMAGE ERROR:",
      error
    );

    thinking.remove();

    addMessage(
      "❌ Image generation failed: " +
      error.message,
      "jarvis"
    );

  }

}


/* =========================
   WEB SEARCH
========================= */

function webSearch(){

  const query =
    prompt(
      "What do you want to search?"
    );

  if(!query){
    return;
  }

  closeCreateMenu();

  const url =
    "https://www.google.com/search?q=" +
    encodeURIComponent(
      query
    );

  window.open(
    url,
    "_blank"
  );

  addMessage(
    "🔍 Searching the web for: " +
    query,
    "jarvis"
  );

}


/* =========================
   VOICE MODE
========================= */

function voiceMode(){

  closeCreateMenu();

  voice();

}


/* =========================
   SETTINGS
========================= */

function showSettings(){

  closeCreateMenu();

  addMessage(

    "⚙️ JARVIS Settings\n\n" +

    "Voice: Enabled\n" +

    "Memory: Session memory enabled\n" +

    "AI: Gemini + Backup AI\n" +

    "Timezone: Asia/Kolkata (IST)",

    "jarvis"

  );

}


/* =========================
   ABOUT
========================= */

function showAbout(){

  closeCreateMenu();

  addMessage(

    "ℹ️ JARVIS 45\n\n" +

    "Created and developed by SOHAM DODWAD.\n" +

    "Personal AI Assistant\n" +

    "Version 1.0",

    "jarvis"

  );

}


/* =========================
   CLOSE CREATE MENU
========================= */

function closeCreateMenu(){

  document
    .getElementById(
      "create"
    )
    .style.display =
      "none";

}


/* =========================
   VOICE INPUT
========================= */

function voice(){

  const input =
    document.getElementById(
      "question"
    );

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if(
    !SpeechRecognition
  ){

    addMessage(

      "Voice recognition is not available. Please use Google Chrome.",

      "jarvis"

    );

    return;

  }

  const recognition =
    new SpeechRecognition();

  recognition.lang =
    "en-IN";

  recognition.continuous =
    false;

  recognition.interimResults =
    false;

  recognition.onstart =
    function(){

      addMessage(
        "🎙️ Listening... Speak now.",
        "jarvis"
      );

    };

  recognition.onresult =
    function(event){

      const text =
        event
          .results[0][0]
          .transcript;

      input.value =
        text;

      ask();

    };

  recognition.onerror =
    function(event){

      addMessage(

        "Voice error: " +
        event.error,

        "jarvis"

      );

    };

  try{

    recognition.start();

  }catch(error){

    console.log(
      error
    );

  }

}


/* =========================
   STOP VOICE
========================= */

function stopSpeaking(){

  if(
    "speechSynthesis" in window
  ){

    window.speechSynthesis.cancel();

  }

}

</script>

</body>
  </html>
