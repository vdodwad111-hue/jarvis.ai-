<script>

/* =========================
   ASK JARVIS
========================= */

async function ask(){

  const input = document.getElementById("question");
  const q = input.value.trim();

  if(!q){
    addMessage(
      "I'm listening... Ask me something.",
      "jarvis"
    );
    return;
  }

  addMessage(q, "user");
  input.value = "";

  const thinking = addThinking();

  try{

    const res = await fetch("/api/chat", {
      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify({
        message: q
      })
    });

    /* GET RESPONSE FIRST */

    const data = await res.json();

    if(!res.ok){
      throw new Error(
        data.error || "Request failed"
      );
    }

    /* REMOVE THINKING DOTS */

    thinking.remove();

    /* SHOW JARVIS RESPONSE */

    const replyText =
      data.reply ||
      "No response received.";

    addMessage(
      replyText,
      "jarvis"
    );

    /* VOICE OUTPUT */

    if("speechSynthesis" in window){

      window.speechSynthesis.cancel();

      const speech =
        new SpeechSynthesisUtterance(
          replyText
        );

      speech.lang = "en-IN";
      speech.rate = 1;
      speech.pitch = 1;

      window.speechSynthesis.speak(
        speech
      );
    }

    scrollChat();

  }catch(error){

    console.error(
      "JARVIS FRONTEND ERROR:",
      error
    );

    thinking.remove();

    addMessage(
      "Sorry, JARVIS couldn't respond.",
      "jarvis"
    );
  }
}


/* =========================
   ADD MESSAGE
========================= */

function addMessage(text, type){

  const reply =
    document.getElementById("reply");

  const message =
    document.createElement("div");

  message.classList.add("message");

  if(type === "user"){

    message.classList.add(
      "user-message"
    );

  }else{

    message.classList.add(
      "jarvis-message"
    );
  }

  message.textContent = text;

  reply.appendChild(message);

  scrollChat();

  return message;
}


/* =========================
   THREE DOT THINKING
========================= */

function addThinking(){

  const reply =
    document.getElementById("reply");

  const message =
    document.createElement("div");

  message.classList.add(
    "message",
    "jarvis-message",
    "thinking"
  );

  for(let i = 0; i < 3; i++){

    const dot =
      document.createElement("span");

    dot.classList.add(
      "thinking-dot"
    );

    message.appendChild(dot);
  }

  reply.appendChild(message);

  scrollChat();

  return message;
}


/* =========================
   SCROLL
========================= */

function scrollChat(){

  const reply =
    document.getElementById("reply");

  reply.scrollTop =
    reply.scrollHeight;
}


/* =========================
   ENTER TO SEND
========================= */

document
  .getElementById("question")
  .addEventListener(
    "keydown",
    function(event){

      if(
        event.key === "Enter" &&
        !event.shiftKey
      ){

        event.preventDefault();

        ask();
      }
    }
  );


/* =========================
   SIDE MENU
========================= */

function toggleSide(){

  document
    .getElementById("side")
    .classList
    .toggle("open");
}


/* =========================
   CREATE MENU
========================= */

function toggleCreate(){

  const menu =
    document.getElementById("create");

  menu.style.display =
    menu.style.display === "block"
    ? "none"
    : "block";
}


function createFile(){

  addMessage(
    "📄 Create File selected.",
    "jarvis"
  );

  document
    .getElementById("create")
    .style.display =
      "none";
}


/* =========================
   VOICE INPUT
========================= */

function voice(){

  const input =
    document.getElementById("question");

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if(!SpeechRecognition){

    addMessage(
      "❌ Voice recognition is not available. Please use Google Chrome.",
      "jarvis"
    );

    return;
  }

  const recognition =
    new SpeechRecognition();

  recognition.lang = "en-IN";
  recognition.continuous = false;
  recognition.interimResults = false;

  recognition.onstart = function(){

    addMessage(
      "🎙️ Listening... Speak now.",
      "jarvis"
    );
  };

  recognition.onresult = function(event){

    const text =
      event.results[0][0].transcript;

    input.value = text;

    ask();
  };

  recognition.onerror = function(event){

    addMessage(
      "❌ Voice error: " +
      event.error,
      "jarvis"
    );
  };

  recognition.onend = function(){

    console.log(
      "Voice recognition ended"
    );
  };

  try{

    recognition.start();

  }catch(error){

    addMessage(
      "❌ Could not start voice recognition. Please try again.",
      "jarvis"
    );
  }
}

                    </script>

</body>
</html>
