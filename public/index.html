<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS 45</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#0b0f14;
  color:white;
  font-family:Arial,sans-serif;
  height:100vh;
  overflow:hidden;
}

.top{
  height:65px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 18px;
  border-bottom:1px solid #202733;
}

.brand{
  font-size:21px;
  font-weight:bold;
  color:#65baff;
}

.menuBtn{
  background:none;
  border:0;
  color:white;
  font-size:25px;
}

.main{
  height:calc(100vh - 65px);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.orb{
  width:120px;
  height:120px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  font-weight:bold;
  font-size:18px;
  letter-spacing:1px;

  background:radial-gradient(
    circle,
    #e5f7ff 0%,
    #62c5ff 15%,
    #168cff 40%,
    #0754b9 65%,
    #06172e 100%
  );

  box-shadow:
    0 0 20px #168cff,
    0 0 50px #0754b9,
    0 0 90px rgba(0,140,255,.45);

  position:relative;
  animation:pulse 3s infinite ease-in-out;
}

.orb:before,
.orb:after{
  content:"";
  position:absolute;
  border:2px solid #249cff;
  border-radius:50%;
}

.orb:before{
  width:145px;
  height:65px;
  transform:rotate(25deg);
}

.orb:after{
  width:160px;
  height:75px;
  transform:rotate(-25deg);
}

@keyframes pulse{
  50%{
    transform:scale(1.06);
  }
}

.welcome{
  text-align:center;
  margin-top:35px;
  margin-bottom:30px;
}

.welcome h1{
  margin:0;
  font-size:30px;
}

.welcome p{
  color:#8995a5;
}

.chat{
  width:100%;
  max-width:680px;
  background:#171d26;
  border:1px solid #293341;
  border-radius:27px;
  padding:13px;
}

textarea{
  width:100%;
  height:65px;
  resize:none;
  border:0;
  outline:0;
  background:transparent;
  color:white;
  font-size:16px;
  padding:8px;
}

textarea::placeholder{
  color:#7f8b9b;
}

.bottom{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.tools{
  display:flex;
  gap:8px;
}

.tool,.send{
  width:43px;
  height:43px;
  border-radius:50%;
  border:0;
  cursor:pointer;
  color:white;
  font-size:18px;
}

.tool{
  background:#232b37;
}

.send{
  background:#168cff;
}

.reply{
  width:100%;
  max-width:680px;
  margin-top:20px;
  color:#d9e7f5;
}

.side{
  position:fixed;
  left:-300px;
  top:0;
  width:300px;
  height:100%;
  background:#111720;
  border-right:1px solid #293341;
  padding:25px;
  z-index:20;
  transition:.3s;
}

.side.open{
  left:0;
}

.side h2{
  color:#65baff;
}

.item{
  padding:15px;
  margin:10px 0;
  border-radius:15px;
  background:#1a222e;
}

.create{
  display:none;
  position:absolute;
  bottom:95px;
  left:20px;
  background:#171e28;
  border:1px solid #303b4a;
  border-radius:18px;
  padding:8px;
  width:190px;
}

.create div{
  padding:13px;
  border-radius:12px;
}

.feedback{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.7);
  align-items:center;
  justify-content:center;
  z-index:30;
}

.feedbackBox{
  width:90%;
  max-width:400px;
  background:#151c26;
  border:1px solid #2b394a;
  border-radius:22px;
  padding:25px;
}

.feedbackBox textarea{
  height:100px;
  background:#0c1118;
  border-radius:14px;
}

.feedbackBox button{
  margin-top:10px;
  padding:12px 20px;
  border:0;
  border-radius:20px;
  background:#168cff;
  color:white;
}
</style>
</head>

<body>

<div class="top">
  <div class="brand">JARVIS 45</div>
  <button class="menuBtn" onclick="toggleSide()">☰</button>
</div>

<div class="main">

  <div class="orb">
    JARVIS<br>45
  </div>

  <div class="welcome">
    <h1>How can I help you?</h1>
    <p>Your personal AI assistant</p>
  </div>

  <div class="chat">

    <textarea
      id="question"
      placeholder="Ask JARVIS..."
    ></textarea>

    <div class="bottom">

      <div class="tools">

        <button class="tool" onclick="toggleCreate()">＋</button>

        <button class="tool" onclick="voice()">🎙</button>

      </div>

      <button class="send" onclick="ask()">↑</button>

    </div>

  </div>

  <div class="reply" id="reply"></div>

</div>

<div class="create" id="create">

  <div onclick="createFile()">📄 Create File</div>
  <div>📎 Upload File</div>
  <div>🖼️ Add Image</div>

</div>

<div class="side" id="side">

  <h2>JARVIS 45</h2>

  <div class="item">💬 New Chat</div>
  <div class="item">🕘 Chat History</div>
  <div class="item">📁 My Files</div>
  <div class="item">⚙️ Settings</div>

  <div class="item" onclick="showFeedback()">
    💬 Feedback
  </div>

  <div class="item" onclick="toggleSide()">
    ✕ Close
  </div>

</div>

<div class="feedback" id="feedback">

  <div class="feedbackBox">

    <h2>Send Feedback</h2>

    <textarea
      id="feedbackText"
      placeholder="Tell us what you think..."
    ></textarea>

    <button onclick="sendFeedback()">Send Feedback</button>

    <button onclick="closeFeedback()">
      Close
    </button>

  </div>

</div>

<script>

function ask(){

  const q=document.getElementById("question").value.trim();

  if(!q){
    document.getElementById("reply").innerText=
      "Ask JARVIS something...";
    return;
  }

  document.getElementById("reply").innerText=
    "You asked: "+q;
}

function toggleSide(){

  document.getElementById("side")
    .classList.toggle("open");

}

function toggleCreate(){

  const menu=document.getElementById("create");

  menu.style.display=
    menu.style.display==="block"
    ? "none"
    : "block";
}

function createFile(){

  document.getElementById("reply").innerText=
    "📄 Create File selected.";

  document.getElementById("create").style.display="none";
}

function voice(){

  if(!("webkitSpeechRecognition" in window)){

    document.getElementById("reply").innerText=
      "Voice recognition is not supported.";

    return;
  }

  const recognition=new webkitSpeechRecognition();

  recognition.lang="en-IN";

  recognition.onresult=function(event){

    document.getElementById("question").value=
      event.results[0][0].transcript;

  };

  recognition.start();
}

function showFeedback(){

  document.getElementById("feedback").style.display="flex";

  toggleSide();
}

function closeFeedback(){

  document.getElementById("feedback").style.display="none";
}

function sendFeedback(){

  const text=document.getElementById("feedbackText").value.trim();

  if(!text){
    alert("Please write your feedback.");
    return;
  }

  closeFeedback();

  document.getElementById("reply").innerText=
    "Thanks for your feedback! 💙";

  document.getElementById("feedbackText").value="";
}

</script>

</body>
</html>
