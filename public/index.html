<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JARVIS AI</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #0b0f16;
  color: #ffffff;
  font-family: Arial, sans-serif;
}

/* TOP BAR */

.topbar {
  height: 65px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 18px;
  border-bottom: 1px solid #202938;
}

.logo {
  font-size: 23px;
  font-weight: bold;
  color: #4da6ff;
}

.menu {
  font-size: 25px;
  cursor: pointer;
}

/* MAIN */

.main {
  min-height: calc(100vh - 65px);
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  padding: 25px;
}

.welcome {
  text-align: center;
  margin-bottom: 35px;
}

.welcome h1 {
  font-size: 34px;
  margin-bottom: 10px;
}

.welcome p {
  color: #8995a8;
}

/* CHAT BOX */

.chatbox {
  width: 100%;
  max-width: 650px;
  background: #151b26;
  border: 1px solid #293448;
  border-radius: 28px;
  padding: 12px;
  box-shadow: 0 0 25px rgba(40,140,255,0.08);
}

textarea {
  width: 100%;
  height: 65px;
  resize: none;
  border: none;
  outline: none;
  background: transparent;
  color: white;
  font-size: 16px;
  padding: 10px;
}

textarea::placeholder {
  color: #7f8da3;
}

.actions {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.left-buttons {
  display: flex;
  gap: 8px;
}

.icon {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  border: none;
  background: #202938;
  color: white;
  font-size: 19px;
  cursor: pointer;
}

.send {
  width: 45px;
  height: 45px;
  border-radius: 50%;
  border: none;
  background: #1683ff;
  color: white;
  font-size: 20px;
  cursor: pointer;
}

/* REPLY */

.reply {
  width: 100%;
  max-width: 650px;
  margin-top: 25px;
  color: #d9e2f0;
  line-height: 1.6;
}

/* MENU */

.side-menu {
  position: fixed;
  top: 0;
  right: -280px;
  width: 280px;
  height: 100%;
  background: #111722;
  border-left: 1px solid #293448;
  padding: 25px;
  transition: 0.3s;
  z-index: 10;
}

.side-menu.open {
  right: 0;
}

.side-menu h2 {
  color: #4da6ff;
}

.option {
  padding: 15px;
  margin: 10px 0;
  background: #1a2230;
  border-radius: 15px;
  cursor: pointer;
}

.option:hover {
  background: #243149;
}

/* FILE PANEL */

.file-panel {
  display: none;
  width: 100%;
  max-width: 650px;
  margin-top: 20px;
}

.file-panel input {
  width: 100%;
  padding: 14px;
  border-radius: 15px;
  border: 1px solid #293448;
  background: #151b26;
  color: white;
  outline: none;
}

.file-panel button {
  margin-top: 10px;
  padding: 12px 20px;
  border: none;
  border-radius: 20px;
  background: #1683ff;
  color: white;
}

</style>
</head>

<body>

<!-- TOP -->

<div class="topbar">

  <div class="logo">JARVIS</div>

  <div class="menu" onclick="openMenu()">☰</div>

</div>


<!-- MAIN -->

<div class="main">

  <div class="welcome">

    <h1>How can I help you?</h1>

    <p>Your personal AI assistant</p>

  </div>


  <!-- CHAT -->

  <div class="chatbox">

    <textarea
      id="question"
      placeholder="Ask JARVIS..."
    ></textarea>

    <div class="actions">

      <div class="left-buttons">

        <button class="icon" onclick="openFile()">
          +
        </button>

        <button class="icon" onclick="voice()">
          🎙
        </button>

      </div>

      <button class="send" onclick="ask()">
        ↑
      </button>

    </div>

  </div>


  <!-- FILE -->

  <div class="file-panel" id="filePanel">

    <input
      id="filename"
      placeholder="Enter file name..."
    >

    <button onclick="createFile()">
      Create File
    </button>

  </div>


  <!-- REPLY -->

  <div class="reply" id="reply"></div>

</div>


<!-- SIDE MENU -->

<div class="side-menu" id="sideMenu">

  <h2>JARVIS</h2>

  <div class="option" onclick="openFile()">
    📄 Create File
  </div>

  <div class="option">
    💬 New Chat
  </div>

  <div class="option">
    📁 My Files
  </div>

  <div class="option">
    ⚙️ Settings
  </div>

  <div class="option" onclick="closeMenu()">
    ✕ Close
  </div>

</div>


<script>

function ask() {

  const q =
    document.getElementById("question").value.trim();

  const reply =
    document.getElementById("reply");

  if (!q) {
    reply.innerText = "Ask me something...";
    return;
  }

  reply.innerText =
    "You asked: " + q;
}


function openMenu() {

  document
    .getElementById("sideMenu")
    .classList.add("open");

}


function closeMenu() {

  document
    .getElementById("sideMenu")
    .classList.remove("open");

}


function openFile() {

  closeMenu();

  document
    .getElementById("filePanel")
    .style.display = "block";

}


function createFile() {

  const name =
    document.getElementById("filename").value.trim();

  const reply =
    document.getElementById("reply");

  if (!name) {

    reply.innerText =
      "Enter a file name first.";

    return;
  }

  reply.innerText =
    "📄 File created: " + name;

}


function voice() {

  if (!("webkitSpeechRecognition" in window)) {

    document.getElementById("reply").innerText =
      "Voice recognition is not supported.";

    return;
  }

  const recognition =
    new webkitSpeechRecognition();

  recognition.lang = "en-IN";

  recognition.onresult = function(event) {

    document.getElementById("question").value =
      event.results[0][0].transcript;

  };

  recognition.start();

}

</script>

</body>
</html>
