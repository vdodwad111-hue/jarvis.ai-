<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JARVIS 45</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

:root{
    --blue:#00bfff;
    --cyan:#00eaff;
    --dark:#010810;
    --glass:rgba(4,25,40,.42);
    --border:rgba(0,200,255,.28);
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    color:white;
    background:
        radial-gradient(circle at 50% 28%,#063d5c 0%,#02131f 27%,#01070d 58%,#000 100%);
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    z-index:0;
    background:
        linear-gradient(rgba(0,190,255,.055) 1px,transparent 1px),
        linear-gradient(90deg,rgba(0,190,255,.055) 1px,transparent 1px);
    background-size:42px 42px;
    animation:gridMove 10s linear infinite;
    pointer-events:none;
}

body::after{
    content:"";
    position:fixed;
    inset:0;
    z-index:0;
    background:radial-gradient(circle at center,transparent 35%,rgba(0,0,0,.65) 100%);
    pointer-events:none;
}

@keyframes gridMove{
    from{transform:translateY(0);}
    to{transform:translateY(42px);}
}

.app{
    position:relative;
    z-index:2;
    width:100%;
    height:100dvh;
    display:flex;
    flex-direction:column;
}

/* =========================
   TOP LEFT MENU BUTTON
========================= */

.menu-button{
    position:absolute;
    top:12px;
    left:12px;
    z-index:1000;

    width:43px;
    height:43px;

    border-radius:13px;
    border:1px solid rgba(0,220,255,.4);

    background:
        linear-gradient(
            145deg,
            rgba(0,180,255,.25),
            rgba(0,45,70,.45)
        );

    color:white;
    font-size:21px;

    display:flex;
    align-items:center;
    justify-content:center;

    box-shadow:
        0 0 18px rgba(0,190,255,.2),
        inset 0 1px rgba(255,255,255,.1);

    backdrop-filter:blur(15px);
    -webkit-backdrop-filter:blur(15px);

    transition:.2s ease;
}

.menu-button:active{
    transform:scale(.92);
}

/* =========================
   SIDE OPTIONS
========================= */

.menu-panel{
    position:fixed;
    top:0;
    left:0;

    width:min(285px,82vw);
    height:100dvh;

    z-index:999;

    padding:75px 14px 20px;

    background:
        linear-gradient(
            180deg,
            rgba(1,18,30,.97),
            rgba(0,5,12,.98)
        );

    border-right:1px solid rgba(0,205,255,.25);

    box-shadow:
        12px 0 45px rgba(0,0,0,.6),
        0 0 35px rgba(0,160,255,.12);

    backdrop-filter:blur(22px);
    -webkit-backdrop-filter:blur(22px);

    transform:translateX(-105%);
    transition:transform .28s cubic-bezier(.22,.8,.25,1);

    overflow-y:auto;
}

.menu-panel.open{
    transform:translateX(0);
}

.menu-title{
    text-align:center;
    color:#dff9ff;
    font-size:18px;
    font-weight:bold;
    letter-spacing:3px;
    margin-bottom:5px;

    text-shadow:
        0 0 10px #00d9ff,
        0 0 25px rgba(0,180,255,.5);
}

.menu-subtitle{
    text-align:center;
    color:rgba(180,230,245,.45);
    font-size:8px;
    letter-spacing:2px;
    margin-bottom:20px;
}

.menu-option{
    width:100%;
    min-height:55px;

    margin-bottom:8px;
    padding:9px 12px;

    border-radius:13px;
    border:1px solid rgba(0,205,255,.22);

    background:
        linear-gradient(
            145deg,
            rgba(20,105,140,.20),
            rgba(2,20,32,.55)
        );

    color:white;

    display:flex;
    align-items:center;
    gap:12px;

    text-align:left;

    box-shadow:
        0 7px 18px rgba(0,0,0,.25),
        inset 0 1px rgba(255,255,255,.06);

    transition:.18s ease;
}

.menu-option:active{
    transform:scale(.97);
    border-color:#00dfff;
}

.menu-option-icon{
    width:35px;
    height:35px;

    flex-shrink:0;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:10px;

    background:rgba(0,190,255,.09);
    border:1px solid rgba(0,210,255,.18);

    font-size:17px;
}

.menu-option-name{
    font-size:12px;
    font-weight:bold;
    letter-spacing:.5px;
}

.menu-option-sub{
    margin-top:3px;
    color:rgba(190,230,245,.42);
    font-size:8px;
}

.menu-overlay{
    position:fixed;
    inset:0;
    z-index:998;

    background:rgba(0,0,0,.48);

    opacity:0;
    pointer-events:none;

    transition:.25s ease;
}

.menu-overlay.open{
    opacity:1;
    pointer-events:auto;
}

/* HEADER */

header{
    position:relative;
    flex-shrink:0;
    text-align:center;
    padding:14px 15px 8px;
    background:rgba(0,8,16,.38);
    border-bottom:1px solid rgba(0,200,255,.18);
    backdrop-filter:blur(18px);
}

.logo{
    font-size:clamp(29px,8vw,52px);
    font-weight:900;
    letter-spacing:8px;
    line-height:1;
    color:#dff9ff;
    text-shadow:
        0 0 5px white,
        0 0 15px #00d9ff,
        0 0 35px #008dcc,
        0 0 70px rgba(0,180,255,.7);
}

.creator{
    margin-top:7px;
    font-size:10px;
    letter-spacing:2.5px;
    color:rgba(190,235,255,.55);
    text-transform:uppercase;
}

.status{
    display:inline-flex;
    align-items:center;
    gap:7px;
    margin-top:8px;
    padding:5px 12px;
    border:1px solid rgba(0,255,160,.22);
    border-radius:20px;
    background:rgba(0,255,160,.045);
    color:#68ffc7;
    font-size:10px;
    letter-spacing:2px;
}

.status-dot{
    width:7px;
    height:7px;
    border-radius:50%;
    background:#00ff9d;
    box-shadow:0 0 12px #00ff9d;
    animation:statusPulse 1.4s infinite;
}

@keyframes statusPulse{
    50%{
        opacity:.35;
        transform:scale(.65);
    }
}

/* MAIN */

.main{
    flex:1;
    min-height:0;
    overflow-y:auto;
    overflow-x:hidden;
    padding:5px 12px 25px;
    scrollbar-width:none;
}

.main::-webkit-scrollbar{
    display:none;
}

/* CORE */

.core-area{
    height:245px;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
}

.core-wrapper{
    width:225px;
    height:225px;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
}

.core-wrapper::before{
    content:"";
    position:absolute;
    width:205px;
    height:205px;
    border-radius:50%;
    border:1px solid rgba(0,205,255,.2);
    box-shadow:
        0 0 35px rgba(0,190,255,.15),
        inset 0 0 35px rgba(0,190,255,.08);
    animation:outerPulse 2.4s ease-in-out infinite;
}

@keyframes outerPulse{
    50%{
        transform:scale(1.08);
        opacity:.5;
    }
}

.core{
    width:135px;
    height:135px;
    border-radius:50%;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;

    background:
        radial-gradient(circle at 35% 28%,
            #e8fbff 0%,
            #5de8ff 7%,
            #00cfff 18%,
            #0078b8 35%,
            #003451 58%,
            #00111c 78%);

    box-shadow:
        0 0 18px #00cfff,
        0 0 45px rgba(0,185,255,.9),
        0 0 95px rgba(0,115,190,.65),
        inset 0 0 35px #00eaff;

    animation:coreIdle 2.1s ease-in-out infinite;
    transition:transform .12s ease,box-shadow .12s ease;
}

.core::before{
    content:"";
    position:absolute;
    width:170%;
    height:170%;
    left:-35%;
    top:-35%;

    background:
        radial-gradient(
            ellipse at 30% 30%,
            rgba(255,255,255,.85) 0%,
            rgba(0,238,255,.8) 7%,
            transparent 25%
        ),
        conic-gradient(
            from 0deg,
            transparent,
            rgba(0,238,255,.9),
            transparent 18%,
            rgba(0,120,255,.8),
            transparent 45%,
            rgba(0,238,255,.8),
            transparent 70%,
            rgba(0,120,255,.7),
            transparent
        );

    filter:blur(5px);
    animation:lavaSpin 3s linear infinite;
}

.core::after{
    content:"";
    position:absolute;
    inset:8px;
    border-radius:50%;
    border:1px solid rgba(150,245,255,.55);
    box-shadow:inset 0 0 22px rgba(0,238,255,.8);
    pointer-events:none;
}

@keyframes coreIdle{
    0%,100%{transform:scale(1);}
    50%{transform:scale(1.055);}
}

@keyframes lavaSpin{
    to{transform:rotate(360deg) scale(1.08);}
}

body.listening .core,
body.speaking .core{
    animation:voiceCore .48s ease-in-out infinite alternate;
}

@keyframes voiceCore{
    from{
        transform:scale(.93);
        box-shadow:
            0 0 20px #00cfff,
            0 0 55px #008dcc,
            0 0 95px rgba(0,190,255,.5),
            inset 0 0 35px #00eaff;
    }
    to{
        transform:scale(1.17);
        box-shadow:
            0 0 35px #00eaff,
            0 0 85px #00bfff,
            0 0 150px rgba(0,190,255,.85),
            inset 0 0 55px #00f5ff;
    }
}

/* ORBITS */

.orbit{
    position:absolute;
    border:1px solid rgba(0,210,255,.5);
    border-radius:50%;
    pointer-events:none;
}

.orbit.one{
    width:175px;
    height:72px;
    transform:rotate(-25deg);
    animation:orbitOne 4s linear infinite;
}

.orbit.two{
    width:195px;
    height:85px;
    transform:rotate(62deg);
    border-color:rgba(0,140,255,.4);
    animation:orbitTwo 5.5s linear infinite reverse;
}

@keyframes orbitOne{
    to{transform:rotate(335deg);}
}

@keyframes orbitTwo{
    to{transform:rotate(-298deg);}
}

.core-label{
    position:relative;
    z-index:3;
    font-size:12px;
    font-weight:bold;
    letter-spacing:3px;
    text-shadow:0 0 12px white;
}

.core-state{
    position:absolute;
    bottom:4px;
    left:0;
    right:0;
    text-align:center;
    color:rgba(150,235,255,.72);
    font-size:9px;
    letter-spacing:3px;
}

/* VOICE */

.voice-control{
    display:flex;
    justify-content:center;
    margin-top:-2px;
}

.voice-button{
    width:170px;
    height:48px;
    border-radius:14px;
    border:1px solid rgba(0,220,255,.42);
    background:
        linear-gradient(135deg,
        rgba(0,190,255,.18),
        rgba(0,60,100,.24));
    backdrop-filter:blur(14px);
    color:white;
    font-weight:bold;
    letter-spacing:1.5px;
    box-shadow:
        0 8px 25px rgba(0,0,0,.35),
        inset 0 1px rgba(255,255,255,.1),
        0 0 18px rgba(0,180,255,.13);
}

.voice-button:active{
    transform:scale(.96);
}

body.listening .voice-button{
    border-color:#00efff;
    box-shadow:
        0 0 25px rgba(0,220,255,.55),
        inset 0 0 20px rgba(0,210,255,.16);
}

/* WAVEFORM */

.waveform{
    height:35px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:3px;
    margin:5px 0 3px;
    opacity:.55;
}

.wave{
    width:3px;
    height:7px;
    border-radius:4px;
    background:#00d9ff;
    box-shadow:0 0 8px #00bfff;
    animation:wave 1s ease-in-out infinite;
}

.wave:nth-child(2){animation-delay:.1s}
.wave:nth-child(3){animation-delay:.2s}
.wave:nth-child(4){animation-delay:.3s}
.wave:nth-child(5){animation-delay:.4s}
.wave:nth-child(6){animation-delay:.3s}
.wave:nth-child(7){animation-delay:.2s}
.wave:nth-child(8){animation-delay:.1s}
.wave:nth-child(9){animation-delay:.25s}

@keyframes wave{
    50%{height:25px}
}

body:not(.listening):not(.speaking) .wave{
    animation-play-state:paused;
    height:5px;
}

/* CHAT */

.chat-title{
    max-width:850px;
    margin:5px auto 7px;
    padding:0 3px;
    color:rgba(160,230,255,.5);
    font-size:9px;
    letter-spacing:3px;
    text-transform:uppercase;
}

#chat{
    width:100%;
    max-width:850px;
    margin:auto;
    display:flex;
    flex-direction:column;
}

.message{
    width:max-content;
    max-width:86%;
    padding:12px 15px;
    margin:6px 0;
    border-radius:15px;
    line-height:1.45;
    word-wrap:break-word;
    animation:messageIn .25s ease;
    font-size:14px;
}

@keyframes messageIn{
    from{
        opacity:0;
        transform:translateY(10px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.user{
    align-self:flex-end;
    background:rgba(0,115,170,.25);
    border:1px solid rgba(0,200,255,.32);
    box-shadow:0 8px 20px rgba(0,0,0,.15);
}

.jarvis{
    align-self:flex-start;
    background:rgba(5,35,52,.48);
    border:1px solid rgba(0,200,255,.25);
    box-shadow:
        0 8px 25px rgba(0,0,0,.2),
        inset 0 1px rgba(255,255,255,.04);
    backdrop-filter:blur(10px);
}

.typing{
    color:#72e5ff;
    font-size:12px;
}

/* QUICK ACTIONS */

.actions-title{
    max-width:850px;
    margin:18px auto 8px;
    color:rgba(170,235,255,.5);
    font-size:9px;
    letter-spacing:3px;
    text-transform:uppercase;
}

.actions{
    width:100%;
    max-width:850px;
    margin:auto;
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:9px;
}

.action{
    min-height:58px;
    padding:10px 12px;
    border-radius:13px;
    border:1px solid rgba(0,205,255,.23);
    background:
        linear-gradient(
            145deg,
            rgba(25,110,145,.20),
            rgba(2,20,32,.38)
        );
    backdrop-filter:blur(16px);
    color:white;
    display:flex;
    align-items:center;
    gap:10px;
    text-align:left;
    box-shadow:
        0 8px 20px rgba(0,0,0,.25),
        inset 0 1px rgba(255,255,255,.07);
    transition:.18s ease;
}

.action:active{
    transform:translateY(2px) scale(.98);
}

.action:hover{
    border-color:rgba(0,220,255,.58);
    background:rgba(0,100,140,.24);
    box-shadow:
        0 0 22px rgba(0,190,255,.18),
        inset 0 1px rgba(255,255,255,.1);
}

.action-icon{
    width:31px;
    height:31px;
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:9px;
    background:rgba(0,190,255,.09);
    border:1px solid rgba(0,210,255,.18);
    font-size:16px;
}

.action-text{
    min-width:0;
}

.action-name{
    font-size:12px;
    font-weight:bold;
    letter-spacing:.5px;
}

.action-sub{
    margin-top:2px;
    font-size:8px;
    color:rgba(190,230,245,.42);
}

/* INPUT */

#inputArea{
    flex-shrink:0;
    width:100%;
    padding:9px 10px 11px;
    display:flex;
    gap:7px;
    background:rgba(0,7,13,.65);
    border-top:1px solid rgba(0,200,255,.17);
    backdrop-filter:blur(20px);
}

#msg{
    flex:1;
    min-width:0;
    height:48px;
    padding:0 14px;
    border-radius:13px;
    outline:none;
    border:1px solid rgba(0,195,255,.24);
    background:rgba(5,28,42,.55);
    color:white;
    font-size:14px;
}

#msg::placeholder{
    color:rgba(190,225,240,.4);
}

#msg:focus{
    border-color:rgba(0,220,255,.6);
    box-shadow:0 0 18px rgba(0,190,255,.16);
}

.input-button{
    width:48px;
    height:48px;
    flex-shrink:0;
    padding:0;
    border-radius:13px;
    color:white;
    border:1px solid rgba(0,205,255,.3);
    background:rgba(5,50,70,.45);
    font-size:17px;
}

.send{
    width:62px;
    flex-shrink:0;
    padding:0;
    border-radius:13px;
    color:white;
    font-size:11px;
    letter-spacing:.5px;
    border:1px solid rgba(0,225,255,.5);
    background:linear-gradient(135deg,#007eae,#005078);
}

/* MOBILE */

@media(max-width:600px){

    .main{
        padding-left:9px;
        padding-right:9px;
    }

    .core-area{
        height:205px;
    }

    .core-wrapper{
        transform:scale(.88);
    }

    .logo{
        letter-spacing:6px;
    }

    .creator{
        font-size:8px;
        letter-spacing:1.8px;
    }

    .actions{
        gap:7px;
    }

    .action{
        min-height:55px;
        padding:8px;
    }

    .action-icon{
        width:29px;
        height:29px;
        font-size:15px;
    }

    .action-name{
        font-size:11px;
    }

    .action-sub{
        font-size:7px;
    }

    .message{
        max-width:90%;
        font-size:13px;
    }

    #inputArea{
        padding:7px;
    }

    #msg{
        height:46px;
        font-size:13px;
    }

    .input-button{
        width:45px;
        height:46px;
    }

    .send{
        width:55px;
        height:46px;
    }
}
</style>
</head>

<body>

<div class="app">

<!-- 🔰 MENU BUTTON -->
<button class="menu-button" onclick="toggleMenu()" aria-label="Open JARVIS menu">
    🔰
</button>

<!-- MENU OVERLAY -->
<div id="menuOverlay" class="menu-overlay" onclick="closeMenu()"></div>

<!-- SIDE MENU -->
<div id="menuPanel" class="menu-panel">

    <div class="menu-title">JARVIS 45</div>

    <div class="menu-subtitle">
        QUICK ACCESS
    </div>

    <button class="menu-option" onclick="menuAction(startListening)">
        <span class="menu-option-icon">🎙️</span>
        <span>
            <div class="menu-option-name">Voice Assistant</div>
            <div class="menu-option-sub">Talk with JARVIS</div>
        </span>
    </button>

    <button class="menu-option" onclick="menuAction(newChat)">
        <span class="menu-option-icon">💬</span>
        <span>
            <div class="menu-option-name">New Chat</div>
            <div class="menu-option-sub">Start fresh conversation</div>
        </span>
    </button>

    <button class="menu-option" onclick="menuAction(webSearch)">
        <span class="menu-option-icon">🌐</span>
        <span>
            <div class="menu-option-name">Web Search</div>
            <div class="menu-option-sub">Search the web</div>
        </span>
    </button>

    <button class="menu-option" onclick="menuAction(openFiles)">
        <span class="menu-option-icon">📁</span>
        <span>
            <div class="menu-option-name">My Files</div>
            <div class="menu-option-sub">Open your files</div>
        </span>
    </button>

    <button class="menu-option" onclick="menuAction(showHistory)">
        <span class="menu-option-icon">🕘</span>
        <span>
            <div class="menu-option-name">Chat History</div>
            <div class="menu-option-sub">Previous conversations</div>
        </span>
    </button>

    <button class="menu-option" onclick="menuAction(showMemory)">
        <span class="menu-option-icon">🧠</span>
        <span>
            <div class="menu-option-name">Memory</div>
            <div class="menu-option-sub">JARVIS memory</div>
        </span>
    </button>

    <button class="menu-option" onclick="menuAction(feedback)">
        <span class="menu-option-icon">⭐</span>
        <span>
            <div class="menu-option-name">Feedback</div>
            <div class="menu-option-sub">Tell us what you think</div>
        </span>
    </button>

    <button class="menu-option" onclick="menuAction(settings)">
        <span class="menu-option-icon">⚙️</span>
        <span>
            <div class="menu-option-name">Settings</div>
            <div class="menu-option-sub">JARVIS controls</div>
        </span>
    </button>

    <button class="menu-option" onclick="menuAction(aboutJarvis)">
        <span class="menu-option-icon">ℹ️</span>
        <span>
            <div class="menu-option-name">About JARVIS</div>
            <div class="menu-option-sub">JARVIS 45 information</div>
        </span>
    </button>

</div>


<header>

    <div class="logo">JARVIS 45</div>

    <div class="status">
        <span class="status-dot"></span>
        SYSTEM ONLINE
    </div>

    <div class="creator">
        FOUNDED &amp; DEVELOPED BY SOHAM DODWAD
    </div>

</header>


<div class="main">

    <div class="core-area">

        <div class="core-wrapper">

            <div class="orbit one"></div>
            <div class="orbit two"></div>

            <div class="core">
                <div class="core-label">JARVIS</div>
            </div>

            <div class="core-state" id="coreState">
                STANDBY
            </div>

        </div>

    </div>


    <div class="voice-control">

        <button class="voice-button" onclick="startListening()">
            🎙️ &nbsp; VOICE ASSISTANT
        </button>

    </div>


    <div class="waveform">

        <span class="wave"></span>
        <span class="wave"></span>
        <span class="wave"></span>
        <span class="wave"></span>
        <span class="wave"></span>
        <span class="wave"></span>
        <span class="wave"></span>
        <span class="wave"></span>
        <span class="wave"></span>

    </div>


    <div class="chat-title">
        LIVE CONVERSATION
    </div>

    <div id="chat">

        <div class="message jarvis">
            Hello! I am JARVIS 45. All systems are online. How may I assist you?
        </div>

    </div>


    <div class="actions-title">
        JARVIS QUICK ACCESS
    </div>

    <div class="actions">

        <button class="action" onclick="startListening()">
            <span class="action-icon">🎙️</span>
            <span class="action-text">
                <span class="action-name">Voice Assistant</span>
                <span class="action-sub">Talk with JARVIS</span>
            </span>
        </button>

        <button class="action" onclick="newChat()">
            <span class="action-icon">💬</span>
            <span class="action-text">
                <span class="action-name">New Chat</span>
                <span class="action-sub">Start fresh</span>
            </span>
        </button>

        <button class="action" onclick="webSearch()">
            <span class="action-icon">🌐</span>
            <span class="action-text">
                <span class="action-name">Web Search</span>
                <span class="action-sub">Search the web</span>
            </span>
        </button>

        <button class="action" onclick="openFiles()">
            <span class="action-icon">📁</span>
            <span class="action-text">
                <span class="action-name">My Files</span>
                <span class="action-sub">Open your files</span>
            </span>
        </button>

        <button class="action" onclick="showHistory()">
            <span class="action-icon">🕘</span>
            <span class="action-text">
                <span class="action-name">Chat History</span>
                <span class="action-sub">Previous conversations</span>
            </span>
        </button>

        <button class="action" onclick="showMemory()">
            <span class="action-icon">🧠</span>
            <span class="action-text">
                <span class="action-name">Memory</span>
                <span class="action-sub">JARVIS memory</span>
            </span>
        </button>

        <button class="action" onclick="feedback()">
            <span class="action-icon">⭐</span>
            <span class="action-text">
                <span class="action-name">Feedback</span>
                <span class="action-sub">Tell us what you think</span>
            </span>
        </button>

        <button class="action" onclick="settings()">
            <span class="action-icon">⚙️</span>
            <span class="action-text">
                <span class="action-name">Settings</span>
                <span class="action-sub">JARVIS controls</span>
            </span>
        </button>

        <button class="action" onclick="aboutJarvis()">
            <span class="action-icon">ℹ️</span>
            <span class="action-text">
                <span class="action-name">About JARVIS</span>
                <span class="action-sub">JARVIS 45 information</span>
            </span>
        </button>

    </div>

</div>


<div id="inputArea">

    <input
        id="msg"
        type="text"
        placeholder="Ask JARVIS..."
        autocomplete="off"
    >

    <button
        class="input-button"
        onclick="startListening()"
        title="Voice"
    >🎙️</button>

    <button
        class="input-button"
        onclick="webSearch()"
        title="Web Search"
    >🌐</button>

    <button
        class="send"
        onclick="send()"
    >SEND</button>

</div>

</div>


<script>

/* =========================
   MENU
========================= */

function toggleMenu(){

    const panel=document.getElementById("menuPanel");
    const overlay=document.getElementById("menuOverlay");

    panel.classList.toggle("open");
    overlay.classList.toggle("open");
}

function closeMenu(){

    document.getElementById("menuPanel").classList.remove("open");
    document.getElementById("menuOverlay").classList.remove("open");
}

function menuAction(action){

    closeMenu();

    setTimeout(function(){

        if(typeof action==="function"){
            action();
        }

    },120);
}


/* =========================
   CORE STATE
========================= */

let currentRecognition=null;

function setCoreState(text){

    document.getElementById("coreState").textContent=text;
}


/* =========================
   SEND MESSAGE
========================= */

async function send(){

    const input=document.getElementById("msg");
    const question=input.value.trim();

    if(!question) return;

    const chat=document.getElementById("chat");

    const userMessage=document.createElement("div");

    userMessage.className="message user";
    userMessage.textContent=question;

    chat.appendChild(userMessage);

    input.value="";

    const typing=document.createElement("div");

    typing.className="message jarvis typing";
    typing.textContent="JARVIS is thinking...";

    chat.appendChild(typing);

    setCoreState("THINKING");

    try{

        const response=await fetch("/ask",{

            method:"POST",

            headers:{
                "Content-Type":"application/json"
            },

            body:JSON.stringify({
                question:question
            })

        });

        if(!response.ok){
            throw new Error("Server returned "+response.status);
        }

        const data=await response.json();

        typing.remove();

        const answer=
            data.answer ||
            data.reply ||
            "I could not generate a response.";

        const jarvisMessage=document.createElement("div");

        jarvisMessage.className="message jarvis";
        jarvisMessage.textContent=answer;

        chat.appendChild(jarvisMessage);

        saveHistory(question,answer);

        setCoreState("STANDBY");

        speak(answer);

    }catch(error){

        typing.remove();

        const errorMessage=document.createElement("div");

        errorMessage.className="message jarvis";

        errorMessage.textContent=
            "Sorry, JARVIS couldn't respond right now.";

        chat.appendChild(errorMessage);

        setCoreState("SYSTEM ONLINE");

        console.log("JARVIS ERROR:",error);

    }

    chat.scrollTop=chat.scrollHeight;
}


/* =========================
   VOICE OUTPUT
========================= */

function speak(text){

    if(!("speechSynthesis" in window)){
        setCoreState("STANDBY");
        return;
    }

    if(!text){
        setCoreState("STANDBY");
        return;
    }

    const voice=new SpeechSynthesisUtterance(text);

    voice.lang="en-IN";
    voice.rate=.9;
    voice.pitch=1;

    voice.onstart=function(){

        document.body.classList.add("speaking");
        setCoreState("JARVIS SPEAKING");

    };

    voice.onend=function(){

        document.body.classList.remove("speaking");
        setCoreState("STANDBY");

    };

    voice.onerror=function(){

        document.body.classList.remove("speaking");
        setCoreState("STANDBY");

    };

    speechSynthesis.cancel();
    speechSynthesis.speak(voice);
}


/* =========================
   VOICE INPUT
========================= */

function startListening(){

    const SpeechRecognition=
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

    if(!SpeechRecognition){

        alert("Voice input is not supported in this browser.");
        return;
    }

    if(currentRecognition){

        currentRecognition.stop();
        currentRecognition=null;

        document.body.classList.remove("listening");
        setCoreState("STANDBY");

        return;
    }

    const recognition=new SpeechRecognition();

    currentRecognition=recognition;

    recognition.lang="en-IN";
    recognition.continuous=false;
    recognition.interimResults=false;
    recognition.maxAlternatives=1;

    recognition.onstart=function(){

        document.body.classList.add("listening");
        setCoreState("LISTENING");

        document.getElementById("msg").placeholder=
            "🎙️ Listening... Speak now.";

    };

    recognition.onresult=function(event){

        const transcript=
            event.results[0][0].transcript;

        document.getElementById("msg").value=
            transcript;

        send();

    };

    recognition.onerror=function(event){

        console.log("Voice error:",event.error);

        document.body.classList.remove("listening");

        setCoreState("STANDBY");

        document.getElementById("msg").placeholder=
            "Ask JARVIS...";

        currentRecognition=null;

    };

    recognition.onend=function(){

        document.body.classList.remove("listening");

        document.getElementById("msg").placeholder=
            "Ask JARVIS...";

        currentRecognition=null;

        if(document.body.classList.contains("speaking")){
            return;
        }

        setCoreState("STANDBY");

    };

    try{

        recognition.start();

    }catch(error){

        console.log(error);

        currentRecognition=null;
        document.body.classList.remove("listening");
        setCoreState("STANDBY");

    }
}


/* =========================
   WEB SEARCH
========================= */

function webSearch(){

    const input=document.getElementById("msg");

    let question=input.value.trim();

    if(!question){

        question=prompt("What do you want to search for?");

    }

    if(!question) return;

    window.open(
        "https://www.google.com/search?q="+
        encodeURIComponent(question),
        "_blank"
    );
}


/* =========================
   NEW CHAT
========================= */

function newChat(){

    closeMenu();

    const chat=document.getElementById("chat");

    chat.innerHTML="";

    const message=document.createElement("div");

    message.className="message jarvis";

    message.textContent=
        "New chat started. I am ready.";

    chat.appendChild(message);

    document.getElementById("msg").value="";

    setCoreState("STANDBY");

    document.getElementById("msg").focus();

}


/* =========================
   CHAT HISTORY
========================= */

function saveHistory(question,answer){

    try{

        let history=
            JSON.parse(
                localStorage.getItem("jarvisHistory") || "[]"
            );

        history.push({
            question:question,
            answer:answer,
            time:new Date().toLocaleString()
        });

        if(history.length>30){
            history=history.slice(-30);
        }

        localStorage.setItem(
            "jarvisHistory",
            JSON.stringify(history)
        );

    }catch(error){

        console.log(error);

    }
}


function showHistory(){

    try{

        const history=
            JSON.parse(
                localStorage.getItem("jarvisHistory") || "[]"
            );

        if(history.length===0){

            alert("No chat history yet.");
            return;

        }

        let text="JARVIS CHAT HISTORY\n\n";

        history
            .slice()
            .reverse()
            .slice(0,10)
            .forEach(function(item,index){

                text+=
                    (index+1)+". "+
                    item.question+
                    "\n"+
                    item.time+
                    "\n\n";

            });

        alert(text);

    }catch(error){

        alert(
            "Chat history is currently unavailable."
        );

    }
}


/* =========================
   MEMORY
========================= */

function showMemory(){

    const memory=
        localStorage.getItem("jarvisMemory");

    if(memory){

        alert(
            "JARVIS MEMORY\n\n"+
            memory
        );

    }else{

        alert(
            "JARVIS MEMORY\n\n"+
            "No saved memories yet.\n\n"+
            "Memory interface is ready."
        );

    }
}


/* =========================
   FILES
========================= */

function openFiles(){

    const input=document.createElement("input");

    input.type="file";
    input.multiple=true;

    input.onchange=function(){

        if(!input.files.length) return;

        let names="Selected files:\n\n";

        for(let i=0;i<input.files.length;i++){

            names+=
                "• "+
                input.files[i].name+
                "\n";

        }

        alert(names);

    };

    input.click();
}


/* =========================
   FEEDBACK
========================= */

function feedback(){

    const message=
        prompt("Enter your feedback for JARVIS:");

    if(!message) return;

    alert(
        "Thank you for your feedback! ⭐"
    );

}


/* =========================
   SETTINGS
========================= */

function settings(){

    alert(
        "JARVIS 45 SETTINGS\n\n"+
        "Voice Assistant: Enabled\n"+
        "Voice Output: Enabled\n"+
        "Web Search: Enabled\n"+
        "Memory: Ready\n"+
        "System Status: ONLINE"
    );

}


/* =========================
   ABOUT
========================= */

function aboutJarvis(){

    alert(
        "JARVIS 45\n\n"+
        "AI Voice Assistant\n\n"+
        "Founded & Developed by\n"+
        "SOHAM DODWAD\n\n"+
        "SYSTEM ONLINE"
    );

}


/* =========================
   ENTER KEY
========================= */

document.getElementById("msg").addEventListener(
    "keydown",
    function(event){

        if(event.key==="Enter"){

            event.preventDefault();

            send();

        }

    }
);

</script>

</body>
